<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña - LCIS</title>
    <!-- Conectamos tu hoja de estilos principal -->
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1>Crear nueva contraseña</h1>
    <p>Estás a un paso de recuperar tu cuenta. Escribe tu nueva contraseña.</p>

    <form id="form-nueva-password">
        <label for="nueva-pass">Nueva contraseña (mínimo 6 caracteres):</label><br>
        <input type="password" id="nueva-pass" required minlength="6"><br><br>

        <button type="submit">Guardar Contraseña</button>
    </form>

    <script type="module" src="nueva-password.js"></script>
</body>
</html>
