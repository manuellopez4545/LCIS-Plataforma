<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCIS - Iniciar Sesión</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1>Portal de Acceso - LCIS</h1>
    
    <!-- Al enviar el formulario, simulamos que nos lleva a la página del cliente -->
    <form action="cliente.html" method="GET">
        <h3>Iniciar Sesión</h3>
        
        <label for="usuario">Usuario / Correo:</label><br>
        <input type="text" id="usuario" name="usuario" placeholder="Tu usuario" required><br><br>

        <label for="password">Contraseña:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <!-- Opción de modo anónimo -->
        <input type="checkbox" id="anonimo" name="anonimo">
        <label for="anonimo">Modo Anónimo (No usar datos personales, solo un nombre de usuario o alias)</label><br><br>

        <button type="submit">Entrar</button>
    </form>

    <p>¿No tienes cuenta? <a href="#">Regístrate aquí</a></p>
    <p>¿Eres de LCIS? <a href="admin.html">Acceso Administrativo</a></p>
</body>
</html>
